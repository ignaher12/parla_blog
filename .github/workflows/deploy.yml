name: Deploy

on:
  push:
    # Mientras se prueba en nuevo.parladiviaggi.com.ar se despliega esta rama.
    # Al mudar el dominio principal, cambiar a [master].
    branches: [migracion-oracle]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Empaquetar (sin dependencias de desarrollo)
        run: |
          npm prune --omit=dev
          tar -czf parla-release.tgz dist node_modules package.json seed

      - name: Configurar SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Subir y activar
        env:
          TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
        run: |
          REL="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          scp -i ~/.ssh/deploy parla-release.tgz "$TARGET:/tmp/parla-release.tgz"
          ssh -i ~/.ssh/deploy "$TARGET" "bash -s -- $REL" < deploy/activate.sh
